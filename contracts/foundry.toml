[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = ["MUSDirectDebit"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.fork]
fuzz = { runs = 100 }

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
